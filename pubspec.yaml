name: covoiturage_etudiant
description: "UniDrive - Application de covoiturage pour étudiants tunisiens"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  maplibre_gl: ^0.27.0
  latlong2: ^0.9.1
  flutter_nominatim: ^0.0.1+2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  table_calendar: ^3.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  supabase_flutter: ^2.9.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon_cov.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2A7C13"
  adaptive_icon_foreground: "assets/images/icon_cov.png"

flutter_native_splash:
  color: "#1D5A0F"
  android: true
  ios: true
  web: false
  android_12:
    color: "#1D5A0F"
    icon_background_color: "#1D5A0F"

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon_cov.png
